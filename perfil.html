<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Perfil - Inmobiliaria Prestige</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="prestige-chatbot.css">

    <script src="theme.js"></script>
</head>

<body class="pagina-privada">

<script>
    if (localStorage.getItem("logged") !== "true") {
        window.location.href = "login.html";
    }
</script>

<header class="header-prestige">

    <div class="logo">INMOBILIARIA <span>PRESTIGE</span></div>

    <nav>
        <ul class="nav-links">

            <li><a href="index.html">Inicio</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="propiedades.html">Propiedades</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="inicio sesion.html">Inicio sesión</a></li>
            <li><a href="perfil.html">Perfil</a></li>

            <li class="dropdown">
                <a href="contacto.html">Contacto ▾</a>
                <ul class="dropdown-menu">
                    <li><a href="contacto.html">Contacto General</a></li>
                    <li><a href="gestionamos.html">Gestionamos su Inmueble</a></li>
                    <li><a href="buscamos.html">Díganos qué busca</a></li>
                </ul>
            </li>

            <li>
                <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
            </li>

        </ul>
    </nav>

</header>

<main class="perfil-layout">

    <!-- SIDEBAR -->
    <aside class="perfil-sidebar">

        <div class="sidebar-header">

            <div class="avatar-large" id="avatarPreview">
                <span id="avatarInitial">U</span>
                <label for="avatarUpload" class="avatar-edit">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="avatarUpload" hidden>
            </div>

            <h3 id="sidebarUserName">Usuario</h3>
            <p class="user-role">Cliente</p>

        </div>

        <nav class="sidebar-menu">

            <button class="menu-btn active" onclick="window.location.href='perfil.html'">
                <i class="fas fa-home"></i> Resumen
            </button>

            <button class="menu-btn" onclick="window.location.href='favoritos.html'">
                <i class="fas fa-heart"></i> Favoritos
            </button>

            <button class="menu-btn" onclick="window.location.href='visitas.html'">
                <i class="fas fa-calendar-check"></i> Visitas
            </button>

            <button class="menu-btn" onclick="window.location.href='mensajes.html'">
                <i class="fas fa-envelope"></i> Mensajes
            </button>

            <button class="menu-btn" onclick="window.location.href='configuracion.html'">
                <i class="fas fa-cog"></i> Configuración
            </button>

            <button class="menu-btn danger" id="btnLogoutSidebar">
                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
            </button>

        </nav>

    </aside>

    <!-- CONTENIDO -->
    <section class="perfil-content">

        <div class="section-header">
            <h1>Resumen de cuenta</h1>
        </div>

        <div class="stats-grid">

            <div class="stat-card">
                <i class="fas fa-heart stat-icon"></i>
                <div>
                    <span class="stat-value" id="statFavoritos">0</span>
                    <span class="stat-label">Favoritos</span>
                </div>
            </div>

            <div class="stat-card">
                <i class="fas fa-calendar-check stat-icon"></i>
                <div>
                    <span class="stat-value" id="statVisitas">0</span>
                    <span class="stat-label">Visitas</span>
                </div>
            </div>

            <div class="stat-card">
                <i class="fas fa-envelope stat-icon"></i>
                <div>
                    <span class="stat-value" id="statMensajes">0</span>
                    <span class="stat-label">Mensajes</span>
                </div>
            </div>

        </div>

    </section>

</main>

<script type="module" src="login.js"></script>
<script src="js/perfil.js"></script>
<script src="prestige-chatbot.js"></script>

</body>
</html>
