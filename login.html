<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inmobiliaria Prestige</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="prestige-chatbot.css">
    <script src="theme.js"></script>
</head>

<body class="login-page">

    <!-- Header / Menú -->
    <header class="header-prestige">
        <div class="logo">INMOBILIARIA <span>PRESTIGE</span></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="propiedades.html">Propiedades</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li id="userMenu"></li>
                <li class="dropdown">
                    <a href="contacto.html">Contacto ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="contacto.html">Contacto General</a></li>
                        <li><a href="gestionamos.html">Gestionamos su Inmueble</a></li>
                        <li><a href="buscamos.html">Díganos qué busca</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <!-- LOGIN -->
    <section class="login">

        <div class="login-box">

            <h1>Inmobiliaria Prestige</h1>
            <p id="titulo">Accede a tu cuenta</p>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="return loginUser()">

                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="pass" placeholder="Contraseña" required>

                <button type="submit">Entrar</button>

            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" onsubmit="return registerUser()" style="display:none;">

                <input type="email" id="newEmail" placeholder="Nuevo email" required>
                <input type="password" id="newPass" placeholder="Nueva contraseña (mín. 6 caracteres)" minlength="6" required>

                <button type="submit">Crear cuenta</button>

            </form>

            <p id="error"></p>

            <!-- TOGGLE -->
            <p>
                <a href="#" id="toggleText" onclick="toggleForm(); return false;">Crear cuenta</a>
            </p>

        </div>
    </section>

    <!-- Firebase Auth + lógica del login -->
    <script type="module" src="login.js"></script>
    <script src="prestige-chatbot.js"></script>

</body>
</html>
