<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inmobiliaria Prestige</title>

    <!-- (Hecho por Miguel) -->
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="prestige-chatbot.css">

    <script src="theme.js"></script>
    <!-- (final de Miguel) -->
</head>

<body class="login-page">

    <!-- (Hecho por Miguel) -->
    <!-- Header / Menú -->
    <header class="header-prestige">
        <div class="logo">INMOBILIARIA <span>PRESTIGE</span></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="propiedades.html">Propiedades</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="login.html" class="active">Login</a></li>

                <!-- Menú usuario -->
                <li id="userMenu"></li>

                <li class="dropdown">
                    <a href="contacto.html">Contacto ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="contacto.html">Contacto General</a></li>
                        <li><a href="gestionamos.html">Gestionamos su Inmueble</a></li>
                        <li><a href="buscamos.html">Díganos qué busca</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>
    <!-- (final de Miguel) -->

    <!-- LOGIN -->
    <section class="login">
        <div class="login-box">

            <h1>Inmobiliaria Prestige</h1>
            <p id="titulo">Accede a tu cuenta</p>

            <!-- FORMULARIO LOGIN -->
            <form id="loginForm">
                <input type="email" id="user" placeholder="Email" required>
                <input type="password" id="pass" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
            </form>

            <!-- FORMULARIO REGISTRO (oculto por defecto) -->
            <form id="registerForm" style="display:none;">
                <input type="email" id="newUser" placeholder="Nuevo email" required>
                <input type="password" id="newPass" placeholder="Contraseña (mín. 6 caracteres)" minlength="6" required>
                <button type="submit">Crear cuenta</button>
            </form>

            <!-- Mensajes de error/éxito -->
            <p id="error"></p>

            <!-- Enlace para cambiar entre login/registro (sin onclick, lo maneja el JS) -->
            <p>
                <a href="#" id="toggleLink">Crear cuenta</a>
            </p>

        </div>
    </section>

    <!-- (Hecho por Miguel) -->
    <!-- Scripts: type="module" para Firebase + eventos manejados por JS -->
    <script type="module" src="login.js"></script>
    <script src="prestige-chatbot.js"></script>
    <!-- (final de Miguel) -->

</body>
</html>
